name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: 👀 Checkout code
        uses: actions/checkout@v4
      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile
      - name: 🔎 Check types
        run: bun run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: 👀 Checkout code
        uses: actions/checkout@v4
      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile
      - name: ✨ Run Linter
        run: bun run lint
      - name: 💅 Check formatting
        run: bun run format:check

  test:
    runs-on: ubuntu-latest
    steps:
      - name: 👀 Checkout code
        uses: actions/checkout@v4
      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile
      - name: 🧪 Run end-to-end tests
        run: bun run test
