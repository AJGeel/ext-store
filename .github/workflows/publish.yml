name: Publish

# Publishes to npm when a version tag is pushed (`V0.1.1`), e.g. `bun run release`.
# Uses npm trusted publishing (OIDC): no npm token is stored anywhere.
on:
  push:
    tags:
      - "V*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    # Must match the environment name in the npm trusted publisher settings.
    environment: npm
    steps:
      - name: 👀 Checkout code
        uses: actions/checkout@v7
      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile
      - name: 🔎 Check types
        run: bun run typecheck
      - name: 🟢 Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: ⬆️ Update npm (trusted publishing needs 11.5.1+)
        run: npm install -g npm@11
      - name: 🏷️ Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "V$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi
      - name: 🚀 Publish
        run: npm publish
