<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      The default screenshot frame. A replacement (screenshots.frame.template)
      must define window.render(data), which returns a promise that resolves
      once everything is loaded:
        { headline: [string, string], screen: URL of the capture,
          backdrop?: URL, title: string, icon?: URL, accent: string, ink: string }
      The page is captured at 1280x800.
    -->
    <style>
      :root {
        --ink: #020e2c;
        --accent: #138cd0;
        --tab-strip: #dee3eb;
        --toolbar: #ffffff;
        --omnibox: #eef1f6;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        width: 1280px;
        height: 800px;
        overflow: hidden;
        font-family: system-ui, sans-serif;
        background: #f4f7fb;
      }

      .backdrop {
        position: absolute;
        inset: -80px;
        background-size: cover;
        background-position: center bottom;
        filter: blur(2px);
        mask-image: linear-gradient(to top, black 0%, transparent 60%);
      }

      h1 {
        position: absolute;
        top: 44px;
        left: 0;
        right: 0;
        text-align: center;
        color: var(--ink);
        font-size: 50px;
        font-weight: 700;
        line-height: 1.08;
        letter-spacing: -0.02em;
      }

      h1 span {
        display: block;
        color: var(--accent);
      }

      .window {
        position: absolute;
        top: 176px;
        left: 100px;
        width: 1080px;
        border-radius: 14px;
        overflow: hidden;
        background: var(--toolbar);
        box-shadow:
          0 1px 2px rgb(2 14 44 / 0.08),
          0 24px 60px -12px rgb(2 14 44 / 0.35);
        outline: 1px solid rgb(2 14 44 / 0.08);
      }

      .tabs {
        display: flex;
        align-items: flex-end;
        gap: 10px;
        height: 34px;
        padding: 0 10px;
        background: var(--tab-strip);
      }

      .dots {
        display: flex;
        gap: 7px;
        align-self: center;
        margin-right: 8px;
      }

      .dots i {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: var(--accent);
      }

      .tab {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 210px;
        height: 28px;
        padding: 0 12px;
        border-radius: 9px 9px 0 0;
        background: var(--toolbar);
        color: #1f2937;
        font-size: 12px;
      }

      .tab img {
        width: 14px;
        height: 14px;
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 14px;
        height: 34px;
        padding: 0 14px;
        color: #6b7280;
        font-size: 13px;
      }

      .omnibox {
        flex: 1;
        height: 24px;
        padding: 0 14px;
        border-radius: 12px;
        background: var(--omnibox);
        line-height: 24px;
        font-size: 12px;
      }

      .screen {
        display: block;
        width: 1080px;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div class="backdrop"></div>
    <h1></h1>
    <div class="window">
      <div class="tabs">
        <div class="dots"><i></i><i></i><i></i></div>
        <div class="tab"><img alt="" /><b></b></div>
      </div>
      <div class="toolbar">
        <span>←</span><span>→</span><span>↻</span>
        <div class="omnibox"></div>
      </div>
      <img class="screen" alt="" />
    </div>
    <script>
      window.render = ({
        headline: [first, second],
        screen,
        backdrop,
        title,
        icon,
        accent,
        ink,
      }) => {
        const root = document.documentElement.style;
        const accentLine = document.createElement("span");
        const decodes = [document.fonts.ready];

        root.setProperty("--accent", accent);
        root.setProperty("--ink", ink);
        accentLine.textContent = second ?? "";
        document.querySelector("h1").replaceChildren(first, accentLine);
        document.querySelector(".tab b").textContent = title;
        document.querySelector(".omnibox").textContent = `Extension (${title})`;

        const tabIcon = document.querySelector(".tab img");

        if (icon) {
          tabIcon.src = icon;
          decodes.push(tabIcon.decode());
        } else {
          tabIcon.remove();
        }

        document.querySelector(".screen").src = screen;
        decodes.push(document.querySelector(".screen").decode());

        if (backdrop) {
          const image = new Image();

          document.querySelector(".backdrop").style.backgroundImage =
            `url("${backdrop}")`;
          image.src = backdrop;
          decodes.push(image.decode());
        }

        return Promise.all(decodes);
      };
    </script>
  </body>
</html>
